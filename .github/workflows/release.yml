# 发布流水线：推 tag（v*）触发。
# electron-builder --publish always 读取 package.json 的 version，创建同名 Release 并上传
# NSIS 安装包 / 便携版 exe / latest.yml / blockmap。客户端（安装版 electron-updater / 便携版
# latest.yml 比对）发布后立即可见。
name: Release

on:
  push:
    tags:
      - "v*"

# 防止并发发版竞争同一 Release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 必需，否则 electron-builder 发布 403
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致（tag v0.1.2 ↔ version 0.1.2）
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 ${PKG_VERSION} 不一致，请对齐后再发版"
            exit 1
          fi
          echo "版本校验通过：v${PKG_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # .npmrc 的 npmmirror 镜像在 CI 同样生效；若 Electron 二进制下载失败，临时移除 .npmrc 重试
        run: npm ci

      - name: 类型检查与前端构建（vue-tsc 门禁）
        run: npm run build

      - name: 核心引擎自测
        run: npm run selftest:core

      - name: 打包并发布 Release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 checksums.txt（SHA-256）
        shell: pwsh
        run: |
          $out = "release/checksums.txt"
          if (Test-Path $out) { Remove-Item $out }
          Get-ChildItem "release" -File | Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" -and $_.Name -ne "builder-debug.yml" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path $out -Value "$hash  $($_.Name)"
          }
          Get-Content $out

      - name: 上传 checksums 到 Release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release upload "v${VERSION}" release/checksums.txt --clobber --repo HUIdada1/Agent_skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验 latest.yml 已正确发布
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # 用带 tag 的直链（无 latest 路由索引延迟）；客户端安装版/便携版都依赖该资产
          URL="https://github.com/HUIdada1/Agent_skills/releases/download/v${PKG_VERSION}/latest.yml"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" 2>/dev/null | grep -q "^version: ${PKG_VERSION}$"; then
              echo "latest.yml 校验通过：version ${PKG_VERSION}"
              exit 0
            fi
            echo "第 $i 次校验未通过，20 秒后重试…"
            sleep 20
          done
          echo "::error::latest.yml 发布校验失败（2 分钟内仍不可下载或版本不匹配），请检查 Release 资产"
          exit 1
