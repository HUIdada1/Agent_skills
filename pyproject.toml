[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills"
dynamic = ["version"]
description = "扫描各 AI Agent 工具的技能目录，去重后收纳进中央仓库，一份真身供所有工具共用"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "agent_skills._version.__version__" }

[tool.setuptools.packages.find]
include = ["agent_skills*"]
